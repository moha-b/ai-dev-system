# .github/workflows/claude-review.yml
# Drop this into each project. Fires automatically when a PR opens or updates.
# Auth: add ONE repo secret — CLAUDE_CODE_OAUTH_TOKEN (from your Claude
# subscription, no metered key) OR ANTHROPIC_API_KEY (pay per review).

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev]          # we only review PRs targeting dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read             # read the diff
  pull-requests: write       # post the review
  issues: read               # read the originating issue

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bring in the global rules/agents/lessons so review can read them.
      - name: Checkout ai-dev-system (rules)
        uses: actions/checkout@v4
        with:
          repository: <your-org>/ai-dev-system
          path: .ai-dev-system
          # If ai-dev-system is private, add: token: ${{ secrets.AIDEV_REPO_TOKEN }}

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Use ONE of the next two lines:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 8
            --model claude-opus-4-8
          prompt: |
            You are reviewing this pull request. Follow .ai-dev-system/LEARNING_LOOP.md exactly.

            1. Read the originating issue (the `Closes #N` in the PR body) with `gh issue view`.
            2. Determine the stack from .claude/conventions.md, then read:
               - .ai-dev-system/GLOBAL_RULES.md
               - .ai-dev-system/agents/<stack>.md   (especially "Patterns we've settled")
               - .ai-dev-system/lessons/<stack>.md
               - .claude/lessons.local.md
            3. Review the diff for: issue fit (every acceptance criterion, no scope creep),
               GLOBAL_RULES violations, stack-agent violations, and any recurred lesson.
            4. Post a grouped, file:line review. Never print secrets, PII, or stack traces.
            5. Classify each finding A/B/C/D and act per LEARNING_LOOP.md:
               - B: append to .claude/lessons.local.md (commit to this PR branch).
               - C/D or any agent enhancement (recurrence Seen:2, or a user correction):
                 do NOT edit the global repo here. Instead, end the review with a
                 "PROMOTE" block listing the exact lesson/agent edits to make, so they
                 can be opened as a human-merged PR against ai-dev-system.

      # Optional: auto-open the promotion PR against ai-dev-system.
      # Requires AIDEV_REPO_TOKEN with write access to that repo. Left disabled by
      # default — promotions are human-gated, and reviewing the PROMOTE block first
      # is the safer path. Enable only once you trust the loop.
